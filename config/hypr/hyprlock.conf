# ceft-shell · pantalla de bloqueo (hyprlock 0.9)
# Los colores y el wallpaper vienen de hyprlock-theme.conf (generado por `ceft-shell theme|wall`).
source = ~/.config/hypr/hyprlock-theme.conf

$font = Inter

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, out
    animation = fadeOut, 1, 3, out
    animation = inputFieldDots, 1, 2, out
    animation = inputFieldColors, 1, 3, out
}

background {
    monitor =
    path = $lock_wall
    color = $lock_bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
    contrast = 0.95
    noise = 0.012
}

# Velo del color del tema para que el texto siempre se lea.
shape {
    monitor =
    size = 100%, 100%
    color = $lock_veil
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# Reloj
label {
    monitor =
    text = $TIME
    color = $lock_fg
    font_size = 150
    font_family = $font Light
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000066)
    position = 0, 260
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-date
    color = $lock_accent
    font_size = 24
    font_family = $font Medium
    position = 0, 150
    halign = center
    valign = center
}

# Panel de vidrio detrás del usuario y el campo
shape {
    monitor =
    size = 420, 190
    color = $lock_glass
    rounding = 36
    border_size = 1
    border_color = $lock_edge
    position = 0, -150
    halign = center
    valign = center
}

# Nombre de usuario
label {
    monitor =
    text = $USER
    color = $lock_fg
    font_size = 17
    font_family = $font SemiBold
    position = 0, -108
    halign = center
    valign = center
}

# Campo de contraseña (píldora)
input-field {
    monitor =
    size = 340, 54
    rounding = -1
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $lock_edge
    inner_color = $lock_field
    font_color = $lock_fg
    check_color = $lock_accent
    fail_color = $lock_error
    capslock_color = $lock_warn
    numlock_color = $lock_accent
    bothlock_color = $lock_warn
    fade_on_empty = false
    hide_input = false
    font_family = $font
    placeholder_text = Contraseña
    check_text = Verificando…
    fail_text = $PAMFAIL
    swap_font_color = false
    position = 0, -180
    halign = center
    valign = center
}

# Aviso de Bloq Mayús
label {
    monitor =
    text = cmd[update:300] ~/.config/hypr/scripts/lock-caps
    color = $lock_warn
    font_size = 14
    font_family = $font Medium
    position = 0, -240
    halign = center
    valign = center
}

# Mensaje inferior
label {
    monitor =
    text = Escribí tu contraseña para desbloquear
    color = $lock_dim
    font_size = 13
    font_family = $font
    position = 0, 36
    halign = center
    valign = bottom
}
