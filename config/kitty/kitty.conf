# ceft-shell · kitty
# Los colores los genera `ceft-shell theme <nombre>` en theme.conf
include theme.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no

# Pegado/copiado universal (SUPER+V/C del historial): shift+insert pega el portapapeles, no la selección
map shift+insert paste_from_clipboard
map ctrl+insert copy_to_clipboard

# Personalizaciones solo de esta máquina (no versionado)
include local.conf
